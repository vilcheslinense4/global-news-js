<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global News Cyber-Hub</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }

        body {
            position: relative;
            background: linear-gradient(135deg, #071114 0%, #0f2027 50%, #172e3a 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }

        /* TEXTURA DE FONDO REFORZADA */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-image: 
                linear-gradient(rgba(0, 210, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 210, 255, 0.02) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
            z-index: 0;
        }

        body::after {
            content: '';
            position: fixed;
            top: -10%;
            left: -10%;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(0, 255, 170, 0.03) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        /* Contenedores con prioridad z-index */
        .top-nav, header, .controles-container, .feed-noticias, footer, .btn-cargar-mas {
            position: relative;
            z-index: 1;
        }

        .top-nav {
            width: 100%;
            max-width: 500px;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            margin-bottom: 20px;
        }

        @media (min-width: 768px) {
            .top-nav, .controles-container {
                max-width: 1000px !important;
            }
        }

        .btn-volver {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(0, 210, 255, 0.1);
            color: #00d2ff;
            border: 1px solid rgba(0, 210, 255, 0.3);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: bold;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .btn-volver:active {
            background: rgba(0, 255, 170, 0.15);
            color: #00ffaa;
            border-color: #00ffaa;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .logo-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
        }

        .cyber-logo {
            position: relative;
            width: 32px;
            height: 32px;
            border: 3px solid #00d2ff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 12px rgba(0, 210, 255, 0.6);
        }

        .cyber-logo::before {
            content: '';
            width: 14px;
            height: 14px;
            border: 2px solid #00ffaa;
            border-radius: 50%;
        }

        .cyber-logo::after {
            content: '';
            position: absolute;
            width: 6px;
            height: 6px;
            background-color: #00ffaa;
            border-radius: 50%;
            box-shadow: 0 0 8px #00ffaa;
            animation: pulse-dot 1.5s infinite ease-in-out;
        }

        @keyframes pulse-dot {
            0% { transform: scale(0.8); opacity: 0.5; }
            50% { transform: scale(1.3); opacity: 1; box-shadow: 0 0 12px #00ffaa; }
            100% { transform: scale(0.8); opacity: 0.5; }
        }

        h1 {
            font-size: 2.2rem;
            color: #00d2ff;
            text-shadow: 0 0 15px rgba(0,210,255,0.5);
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .subtitulo {
            font-size: 0.95rem;
            opacity: 0.85;
            max-width: 450px;
            line-height: 1.4;
        }

        /* Bloque unificado para los controles superiores */
        .controles-container {
            width: 100%;
            max-width: 500px;
            margin-bottom: 25px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .control-group label {
            font-size: 0.85rem;
            color: #00ffaa;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: bold;
        }

        .select-cyber {
            width: 100%;
            padding: 14px;
            background: #09171c;
            color: #00d2ff;
            border: 1px solid rgba(0, 210, 255, 0.35);
            border-radius: 12px;
            font-size: 1rem;
            font-weight: bold;
            outline: none;
            cursor: pointer;
            transition: all 0.3s ease;
            -webkit-appearance: none;
            appearance: none;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100' fill='%2300d2ff'><polygon points='0,0 100,0 50,50'/></svg>");
            background-repeat: no-repeat;
            background-position: right 15px center;
            background-size: 12px;
        }

        .select-cyber:focus {
            border-color: #00ffaa;
            box-shadow: 0 0 10px rgba(0, 255, 170, 0.3);
            color: #00ffaa;
        }

        .select-cyber option {
            background: #14262c;
            color: #00d2ff;
        }

        /* NUEVA ESTILIZACIÓN DE LA BARRA DE BÚSQUEDA */
        .search-wrapper {
            display: flex;
            gap: 10px;
            width: 100%;
        }

        .input-cyber {
            flex-grow: 1;
            padding: 14px;
            background: #09171c;
            color: white;
            border: 1px solid rgba(0, 210, 255, 0.35);
            border-radius: 12px;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-cyber::placeholder {
            color: rgba(0, 210, 255, 0.4);
        }

        .input-cyber:focus {
            border-color: #00ffaa;
            box-shadow: 0 0 10px rgba(0, 255, 170, 0.3);
        }

        .btn-buscar {
            padding: 0 20px;
            background: rgba(0, 210, 255, 0.15);
            border: 1px solid rgba(0, 210, 255, 0.4);
            color: #00d2ff;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-buscar:active {
            background: rgba(0, 255, 170, 0.2);
            border-color: #00ffaa;
            color: #00ffaa;
        }

        /* REJILLA ADAPTABLE */
        .feed-noticias {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        @media (min-width: 768px) {
            .feed-noticias {
                max-width: 1000px;
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
                gap: 25px;
            }
            .controles-container {
                display: grid;
                grid-template-columns: 1fr 1fr;
                align-items: flex-end;
            }
        }

        .noticia-tarjeta {
            background: rgba(14, 27, 33, 0.92);
            backdrop-filter: blur(8px);
            border-left: 4px solid #00d2ff;
            border-radius: 0 16px 16px 0;
            box-shadow: 0 8px 25px rgba(0,0,0,0.45);
            transition: all 0.2s ease;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            border-right: 1px solid rgba(255, 255, 255, 0.02);
            height: 100%;
        }

        .noticia-tarjeta:active {
            background: rgba(20, 38, 46, 0.95);
        }

        .noticia-img-container {
            width: 100%;
            height: 180px;
            position: relative;
            background: linear-gradient(45deg, #102026, #1b333b);
            display: flex;
            align-items: center;
            justify-content: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .noticia-img-placeholder {
            font-size: 2.5rem;
            opacity: 0.15;
        }

        .noticia-img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .noticia-cuerpo {
            padding: 16px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .noticia-tarjeta h3 {
            font-size: 1.05rem;
            margin-bottom: 8px;
            color: #ffffff;
            text-shadow: 0 1px 2px rgba(0,0,0,0.5);
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .noticia-tarjeta p {
            font-size: 0.9rem;
            margin: 8px 0 12px 0;
            color: rgba(255, 255, 255, 0.88);
            line-height: 1.4;
            flex-grow: 1;
        }

        .noticia-footer {
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            padding-top: 12px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: auto;
        }

        .noticia-info {
            font-size: 0.8rem;
            color: #00ffaa;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 5px;
            font-weight: 500;
        }

        .noticia-tarjeta a {
            color: #00d2ff;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.9rem;
            align-self: flex-start;
        }
        
        .noticia-tarjeta a:active {
            color: #00ffaa;
        }

        .btn-cargar-mas {
            display: none;
            width: 100%;
            max-width: 500px;
            padding: 15px;
            margin-top: 15px;
            margin-bottom: 25px;
            background: linear-gradient(90deg, rgba(0,210,255,0.15) 0%, rgba(0,255,170,0.15) 100%);
            color: #00d2ff;
            border: 1px solid rgba(0, 210, 255, 0.4);
            border-radius: 12px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,210,255,0.1);
        }

        @media (min-width: 768px) {
            .btn-cargar-mas {
                max-width: 1000px;
            }
        }

        .btn-cargar-mas:active {
            transform: scale(0.98);
            border-color: #00ffaa;
            color: #00ffaa;
            box-shadow: 0 4px 20px rgba(0,255,170,0.2);
        }

        footer {
            margin-top: auto;
            padding: 25px 0 10px 0;
            text-align: center;
            font-size: 0.75rem;
            opacity: 0.4;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        @keyframes skeleton-blink {
            0% { background-color: rgba(255, 255, 255, 0.05); }
            50% { background-color: rgba(255, 255, 255, 0.15); }
            100% { background-color: rgba(255, 255, 255, 0.05); }
        }

        .skeleton-box {
            animation: skeleton-blink 1.2s infinite ease-in-out;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <div class="top-nav">
        <a href="../" class="btn-volver" onclick="playCyberClick()">⬅️ Volver a Proyectos</a>
    </div>

    <header>
        <div class="logo-container">
            <div class="cyber-logo"></div>
            <h1>CyberNews Hub</h1>
        </div>
        <p class="subtitulo">Conexión satelital con los principales focos de información global.</p>
    </header>

    <div class="controles-container">
        <div class="control-group">
            <label for="pais-selector">🛰️ Sintonizar Estación:</label>
            <select id="pais-selector" class="select-cyber">
                <option value="" disabled selected>-- Selecciona un país del mundo --</option>
                <option value="es">🇪🇸 España</option>
                <option value="us">🇺🇸 Estados Unidos</option>
                <option value="mx">🇲🇽 México</option>
                <option value="ar">🇦🇷 Argentina</option>
                <option value="co">🇨🇴 Colombia</option>
                <option value="cl">🇨🇱 Chile</option>
                <option value="gb">🇬🇧 Reino Unido</option>
                <option value="fr">🇫🇷 Francia</option>
                <option value="de">🇩🇪 Alemania</option>
                <option value="it">🇮🇹 Italia</option>
                <option value="pt">🇵🇹 Portugal</option>
                <option value="jp">🇯🇵 Japón</option>
                <option value="cn">🇨🇳 China</option>
                <option value="kr">🇰🇷 Corea del Sur</option>
                <option value="in">🇮🇳 India</option>
                <option value="ru">🇷🇺 Rusia</option>
                <option value="br">🇧🇷 Brasil</option>
                <option value="ca">🇨🇦 Canadá</option>
                <option value="au">🇦🇺 Australia</option>
                <option value="za">🇿🇦 Sudáfrica</option>
                <option value="eg">🇪🇬 Egipto</option>
            </select>
        </div>

        <div class="control-group">
            <label for="buscador-cyber">🔍 Filtrar Frecuencia (Palabra Clave):</label>
            <div class="search-wrapper">
                <input type="text" id="buscador-cyber" class="input-cyber" placeholder="Ej: fútbol, tecnología, real madrid...">
                <button id="btn-buscar" class="btn-buscar">Buscar</button>
            </div>
        </div>
    </div>

    <div class="feed-noticias" id="feed">
        <div class="noticia-tarjeta">
            <div class="noticia-cuerpo">
                <h3>Selecciona un objetivo en la barra superior para establecer conexión satelital...</h3>
                <div class="noticia-footer" style="border: none; padding: 0; margin-top: 10px;">
                    <div class="noticia-info">
                        <span>Sistema: Listo</span>
                        <span>Canal: Standby</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <button id="btn-cargar" class="btn-cargar-mas">🔄 Cargar más noticias de esta región</button>

    <footer>
        🛰️ terminal cuántica de noticias de última hora • 2026
    </footer>

    <script>
        const MI_API_KEY = "pub_c49581d6d14b474f90eb927fd3288125";
        
        let proximaPaginaID = null;
        let paisActual = "";

        function formatearFuente(fuenteOriginal) {
            if (!fuenteOriginal) return 'Global';
            let f = fuenteOriginal.toLowerCase().trim();
            if (f.includes('laopiniondemucria')) return 'La Opinión de Murcia';
            if (f.includes('elcorreogallego')) return 'El Correo Gallego';
            if (f.includes('lavanguardia')) return 'La Vanguardia';
            if (f.includes('expansion')) return 'Expansión';
            return fuenteOriginal.toUpperCase();
        }

        function playCyberClick() {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                const audioCtx = new AudioContext();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                
                osc.type = 'sine'; 
                osc.frequency.setValueAtTime(1400, audioCtx.currentTime); 
                osc.frequency.exponentialRampToValueAtTime(400, audioCtx.currentTime + 0.04);
                
                gain.gain.setValueAtTime(0.12, audioCtx.currentTime); 
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.04);
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.04);
            } catch (e) {
                console.log("Audio no disponible");
            }
        }

        const selector = document.getElementById('pais-selector');
        const buscador = document.getElementById('buscador-cyber');
        const btnBuscar = document.getElementById('btn-buscar');
        const feed = document.getElementById('feed');
        const btnCargar = document.getElementById('btn-cargar');

        async function descargarNoticias(acumular = false) {
            if (!paisActual) return; 

            if (!acumular) {
                feed.innerHTML = "";
                btnCargar.style.display = "none";
                proximaPaginaID = null;
                
                for (let i = 0; i < 3; i++) {
                    feed.innerHTML += `
                        <div class="noticia-tarjeta" style="border-left-color: #00ffaa;">
                            <div class="skeleton-box" style="width: 100%; height: 140px; opacity: 0.4;"></div>
                            <div class="noticia-cuerpo">
                                <div class="skeleton-box" style="width: 85%; height: 18px; margin-bottom: 10px;"></div>
                                <div class="skeleton-box" style="width: 60%; height: 14px; margin-bottom: 15px;"></div>
                                <div class="skeleton-box" style="width: 100%; height: 35px;"></div>
                            </div>
                        </div>
                    `;
                }
            } else {
                btnCargar.innerText = "🛰️ Conectando con el satélite...";
            }

            try {
                let url = `https://newsdata.io/api/1/news?apikey=${MI_API_KEY}&country=${paisActual}&language=es,en`;
                
                const textoBusqueda = buscador.value.trim();
                if (textoBusqueda !== "") {
                    url += `&q=${encodeURIComponent(textoBusqueda)}`;
                }

                if (acumular && proximaPaginaID) {
                    url += `&page=${proximaPaginaID}`;
                }

                const respuesta = await fetch(url);
                const datos = await respuesta.json();
                
                if (!acumular) feed.innerHTML = "";

                if (datos.results && datos.results.length > 0) {
                    proximaPaginaID = datos.nextPage || null;

                    datos.results.forEach(noticia => {
                        const descripcion = noticia.description ? noticia.description.slice(0, 150) + "..." : "Pulsa en el enlace inferior para leer la cobertura completa de este titular.";
                        const fuenteLimpia = formatearFuente(noticia.source_id);
                        
                        let bloqueImagen = `
                            <div class="noticia-img-container">
                                <div class="noticia-img-placeholder">🛰️</div>
                        `;
                        if (noticia.image_url && noticia.image_url.startsWith('http')) {
                            bloqueImagen += `<img src="${noticia.image_url}" class="noticia-img" onerror="this.style.display='none';" alt="Noticia">`;
                        }
                        bloqueImagen += `</div>`;

                        feed.innerHTML += `
                            <div class="noticia-tarjeta" style="border-left-color: #00d2ff;">
                                ${bloqueImagen}
                                <div class="noticia-cuerpo">
                                    <h3>${noticia.title}</h3>
                                    <p>${descripcion}</p>
                                    <div class="noticia-footer">
                                        <div class="noticia-info">
                                            <span>🌐 Fuente: ${fuenteLimpia}</span>
                                            <span>⏱️ En vivo</span>
                                        </div>
                                        <a href="${noticia.link}" target="_blank" class="fx-click">Leer noticia original →</a>
                                    </div>
                                </div>
                            </div>
                        `;
                    });

                    if (proximaPaginaID) {
                        btnCargar.style.display = "block";
                        btnCargar.innerText = "🔄 Cargar más noticias de esta región";
                    } else {
                        btnCargar.style.display = "none";
                    }

                } else {
                    if (!acumular) {
                        feed.innerHTML = `
                            <div class="noticia-tarjeta" style="border-left-color: #ff0055;">
                                <div class="noticia-cuerpo">
                                    <h3>⚠️ [SIN SEÑAL] No se han encontrado frecuencias asociadas a ese término en este cuadrante.</h3>
                                    <div class="noticia-footer" style="border: none; padding: 0; margin-top: 10px;">
                                        <div class="noticia-info">
                                            <span>Búsqueda: Sin resultados</span>
                                            <span>Código: 404_EMPTY</span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        `;
                    }
                }

            } catch (error) {
                if (!acumular) {
                    feed.innerHTML = `
                        <div class="noticia-tarjeta" style="border-left-color: #ff0055;">
                            <div class="noticia-cuerpo">
                                <h3>❌ [ERROR SATELITAL] Conexión interrumpida con el servidor internacional.</h3>
                                <div class="noticia-footer" style="border: none; padding: 0; margin-top: 10px;">
                                    <div class="noticia-info">
                                        <span>Fallo: FETCH_ERROR</span>
                                        <span>Sistema: Bloqueado</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                }
            }

            document.querySelectorAll('.fx-click').forEach(enlace => {
                enlace.addEventListener('click', playCyberClick);
            });
        }

        selector.addEventListener('change', () => {
            paisActual = selector.value;
            descargarNoticias(false);
        });

        btnBuscar.addEventListener('click', () => {
            playCyberClick();
            descargarNoticias(false);
        });

        buscador.addEventListener('keyup', (e) => {
            if (e.key === 'Enter') {
                playCyberClick();
                descargarNoticias(false);
            }
        });

        btnCargar.addEventListener('click', () => {
            playCyberClick();
            descargarNoticias(true);
        });
    </script>
</body>
</html>
