<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global News Cyber-Hub</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }

        body {
            background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        /* Contenedor superior para el botón volver y el título */
        .top-nav {
            width: 100%;
            max-width: 500px;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            margin-bottom: 15px;
        }

        .btn-volver {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 210, 255, 0.1);
            color: #00d2ff;
            border: 1px solid rgba(0, 210, 255, 0.3);
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: bold;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .btn-volver:active {
            background: rgba(0, 255, 170, 0.2);
            color: #00ffaa;
            border-color: #00ffaa;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        h1 {
            font-size: 2rem;
            color: #00d2ff;
            text-shadow: 0 0 15px rgba(0,210,255,0.4);
            margin-bottom: 8px;
        }

        .subtitulo {
            font-size: 0.95rem;
            opacity: 0.8;
            max-width: 450px;
            margin: 0 auto;
        }

        .selector-container {
            width: 100%;
            max-width: 500px;
            margin-bottom: 25px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .selector-container label {
            font-size: 0.85rem;
            color: #00ffaa;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: bold;
        }

        .select-cyber {
            width: 100%;
            padding: 14px;
            background: rgba(0, 0, 0, 0.4);
            color: #00d2ff;
            border: 1px solid rgba(0, 210, 255, 0.3);
            border-radius: 12px;
            font-size: 1rem;
            font-weight: bold;
            outline: none;
            cursor: pointer;
            transition: all 0.3s ease;
            -webkit-appearance: none;
            appearance: none;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100' fill='%2300d2ff'><polygon points='0,0 100,0 50,50'/></svg>");
            background-repeat: no-repeat;
            background-position: right 15px center;
            background-size: 12px;
        }

        .select-cyber:focus {
            border-color: #00ffaa;
            box-shadow: 0 0 10px rgba(0, 255, 170, 0.3);
            color: #00ffaa;
        }

        .select-cyber option {
            background: #14262c;
            color: #00d2ff;
        }

        .feed-noticias {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .noticia-tarjeta {
            background: rgba(255, 255, 255, 0.06);
            border-left: 4px solid #00d2ff;
            border-radius: 0 16px 16px 0;
            box-shadow: 0 6px 15px rgba(0,0,0,0.2);
            transition: all 0.2s ease;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .noticia-tarjeta:active {
            background: rgba(255, 255, 255, 0.12);
        }

        .noticia-img {
            width: 100%;
            height: 190px;
            object-fit: cover;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .noticia-cuerpo {
            padding: 16px;
        }

        .noticia-tarjeta h3 {
            font-size: 1.05rem;
            margin-bottom: 8px;
            color: white;
            line-height: 1.4;
        }

        .noticia-tarjeta p {
            font-size: 0.9rem;
            margin: 8px 0 12px 0;
            opacity: 0.85;
            line-height: 1.4;
        }

        .noticia-footer {
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            padding-top: 12px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .noticia-info {
            font-size: 0.8rem;
            color: #00ffaa;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 5px;
            opacity: 0.9;
        }

        .noticia-tarjeta a {
            color: #00d2ff;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.9rem;
            align-self: flex-start;
        }
        
        .noticia-tarjeta a:active {
            color: #00ffaa;
        }

        /* Botón de Cargar Más Noticias */
        .btn-cargar-mas {
            display: none;
            width: 100%;
            max-width: 500px;
            padding: 15px;
            margin-top: 15px;
            margin-bottom: 25px;
            background: linear-gradient(90deg, rgba(0,210,255,0.15) 0%, rgba(0,255,170,0.15) 100%);
            color: #00d2ff;
            border: 1px solid rgba(0, 210, 255, 0.4);
            border-radius: 12px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,210,255,0.1);
        }

        .btn-cargar-mas:active {
            transform: scale(0.98);
            border-color: #00ffaa;
            color: #00ffaa;
            box-shadow: 0 4px 20px rgba(0,255,170,0.2);
        }

        /* Cierre estético inferior */
        footer {
            margin-top: auto;
            padding: 25px 0 10px 0;
            text-align: center;
            font-size: 0.75rem;
            opacity: 0.4;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* Animaciones del efecto de carga */
        @keyframes skeleton-blink {
            0% { background-color: rgba(255, 255, 255, 0.05); }
            50% { background-color: rgba(255, 255, 255, 0.15); }
            100% { background-color: rgba(255, 255, 255, 0.05); }
        }

        .skeleton-box {
            animation: skeleton-blink 1.2s infinite ease-in-out;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <div class="top-nav">
        <a href="../" class="btn-volver" onclick="playCyberClick()">⬅️ Volver a Proyectos</a>
    </div>

    <header>
        <h1>🌍 CyberNews Hub</h1>
        <p class="subtitulo">Conexión satelital con los principales focos de información global.</p>
    </header>

    <div class="selector-container">
        <label for="pais-selector">🛰️ Sintonizar Estación:</label>
        <select id="pais-selector" class="select-cyber">
            <option value="" disabled selected>-- Selecciona un país del mundo --</option>
            <option value="es">🇪🇸 España</option>
            <option value="us">🇺🇸 Estados Unidos</option>
            <option value="mx">🇲🇽 México</option>
            <option value="ar">🇦🇷 Argentina</option>
            <option value="co">🇨🇴 Colombia</option>
            <option value="cl">🇨🇱 Chile</option>
            <option value="gb">🇬🇧 Reino Unido</option>
            <option value="fr">🇫🇷 Francia</option>
            <option value="de">🇩🇪 Alemania</option>
            <option value="it">🇮🇹 Italia</option>
            <option value="pt">🇵🇹 Portugal</option>
            <option value="jp">🇯🇵 Japón</option>
            <option value="cn">🇨🇳 China</option>
            <option value="kr">🇰🇷 Corea del Sur</option>
            <option value="in">🇮🇳 India</option>
            <option value="ru">🇷🇺 Rusia</option>
            <option value="br">🇧🇷 Brasil</option>
            <option value="ca">🇨🇦 Canadá</option>
            <option value="au">🇦🇺 Australia</option>
            <option value="za">🇿🇦 Sudáfrica</option>
            <option value="eg">🇪🇬 Egipto</option>
        </select>
    </div>

    <div class="feed-noticias" id="feed">
        <div class="noticia-tarjeta">
            <div class="noticia-cuerpo">
                <h3>Selecciona un objetivo en la barra superior para establecer conexión satelital...</h3>
                <div class="noticia-footer" style="border: none; padding: 0; margin-top: 10px;">
                    <div class="noticia-info">
                        <span>Sistema: Listo</span>
                        <span>Canal: Standby</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <button id="btn-cargar" class="btn-cargar-mas">🔄 Cargar más noticias de esta región</button>

    <footer>
        🛰️ terminal cuántica de noticias de última hora • 2026
    </footer>

    <script>
        const MI_API_KEY = "pub_c49581d6d14b474f90eb927fd3288125";
        
        // Variables de control de paginación
        let proximaPaginaID = null;
        let paisActual = "";

        function playCyberClick() {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                const audioCtx = new AudioContext();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                
                osc.type = 'sine'; 
                osc.frequency.setValueAtTime(1400, audioCtx.currentTime); 
                osc.frequency.exponentialRampToValueAtTime(400, audioCtx.currentTime + 0.04);
                
                gain.gain.setValueAtTime(0.12, audioCtx.currentTime); 
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.04);
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.04);
            } catch (e) {
                console.log("Audio no disponible");
            }
        }

        const selector = document.getElementById('pais-selector');
        const feed = document.getElementById('feed');
        const btnCargar = document.getElementById('btn-cargar');

        // Función principal de descarga remota
        async function descargarNoticias(acumular = false) {
            if (!acumular) {
                feed.innerHTML = "";
                btnCargar.style.display = "none";
                proximaPaginaID = null;
                
                // Efecto de carga inicial elegante (Skeleton bars)
                for (let i = 0; i < 3; i++) {
                    feed.innerHTML += `
                        <div class="noticia-tarjeta" style="border-left-color: #00ffaa;">
                            <div class="skeleton-box" style="width: 100%; height: 140px; opacity: 0.4;"></div>
                            <div class="noticia-cuerpo">
                                <div class="skeleton-box" style="width: 85%; height: 18px; margin-bottom: 10px;"></div>
                                <div class="skeleton-box" style="width: 60%; height: 14px; margin-bottom: 15px;"></div>
                                <div class="skeleton-box" style="width: 100%; height: 35px;"></div>
                            </div>
                        </div>
                    `;
                }
            } else {
                btnCargar.innerText = "🛰️ Conectando con el satélite...";
            }

            try {
                // Construcción de la dirección del satélite incorporando el token de página siguiente si existe
                let url = `https://newsdata.io/api/1/news?apikey=${MI_API_KEY}&country=${paisActual}&language=es,en`;
                if (acumular && proximaPaginaID) {
                    url += `&page=${proximaPaginaID}`;
                }

                const respuesta = await fetch(url);
                const datos = await respuesta.json();
                
                if (!acumular) feed.innerHTML = "";

                if (datos.results && datos.results.length > 0) {
                    // Guardamos la ID del siguiente bloque de datos provisto por el servidor
                    proximaPaginaID = datos.nextPage || null;

                    datos.results.forEach(noticia => {
                        const descripcion = noticia.description ? noticia.description.slice(0, 150) + "..." : "Pulsa en el enlace inferior para leer la cobertura completa de este titular.";
                        
                        let bloqueImagen = "";
                        if (noticia.image_url && noticia.image_url.startsWith('http')) {
                            bloqueImagen = `<img src="${noticia.image_url}" class="noticia-img" onerror="this.style.display='none';" alt="Noticia">`;
                        }

                        feed.innerHTML += `
                            <div class="noticia-tarjeta" style="border-left-color: #00d2ff;">
                                ${bloqueImagen}
                                <div class="noticia-cuerpo">
                                    <h3>${noticia.title}</h3>
                                    <p>${descripcion}</p>
                                    <div class="noticia-footer">
                                        <div class="noticia-info">
                                            <span>🌐 Fuente: ${(noticia.source_id || 'Global').toUpperCase()}</span>
                                            <span>⏱️ En vivo</span>
                                        </div>
                                        <a href="${noticia.link}" target="_blank" class="fx-click">Leer noticia original →</a>
                                    </div>
                                </div>
                            </div>
                        `;
                    });

                    // Si quedan más paquetes de datos disponibles en el servidor, desplegamos el cargador inferior
                    if (proximaPaginaID) {
                        btnCargar.style.display = "block";
                        btnCargar.innerText = "🔄 Cargar más noticias de esta región";
                    } else {
                        btnCargar.style.display = "none";
                    }

                } else {
                    if (!acumular) {
                        feed.innerHTML = `
                            <div class="noticia-tarjeta" style="border-left-color: #ff0055;">
                                <div class="noticia-cuerpo">
                                    <h3>⚠️ [SIN SEÑAL] No se han encontrado frecuencias disponibles en este cuadrante ahora mismo.</h3>
                                    <div class="noticia-footer" style="border: none; padding: 0; margin-top: 10px;">
                                        <div class="noticia-info">
                                            <span>Sistema: Standby</span>
                                            <span>Código: 404_EMPTY</span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        `;
                    }
                }

            } catch (error) {
                if (!acumular) {
                    feed.innerHTML = `
                        <div class="noticia-tarjeta" style="border-left-color: #ff0055;">
                            <div class="noticia-cuerpo">
                                <h3>❌ [ERROR SATELITAL] Conexión interrumpida con el servidor internacional.</h3>
                                <div class="noticia-footer" style="border: none; padding: 0; margin-top: 10px;">
                                    <div class="noticia-info">
                                        <span>Fallo: FETCH_ERROR</span>
                                        <span>Sistema: Bloqueado</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                }
            }

            document.querySelectorAll('.fx-click').forEach(enlace => {
                enlace.addEventListener('click', playCyberClick);
            });
        }

        // Evento al conmutar la estación de un país
        selector.addEventListener('change', () => {
            paisActual = selector.value;
            descargarNoticias(false);
        });

        // Evento al pulsar la barra inferior de expansión
        btnCargar.addEventListener('click', () => {
            playCyberClick();
            descargarNoticias(true);
        });
    </script>
</body>
</html>
