<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global News Cyber-Hub</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }

        body {
            background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
            margin-top: 10px;
        }

        h1 {
            font-size: 2rem;
            color: #00d2ff;
            text-shadow: 0 0 15px rgba(0,210,255,0.4);
            margin-bottom: 8px;
        }

        .subtitulo {
            font-size: 0.95rem;
            opacity: 0.8;
        }

        .selector-container {
            width: 100%;
            max-width: 500px;
            margin-bottom: 30px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .selector-container label {
            font-size: 0.85rem;
            color: #00ffaa;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: bold;
        }

        .select-cyber {
            width: 100%;
            padding: 14px;
            background: rgba(0, 0, 0, 0.4);
            color: #00d2ff;
            border: 1px solid rgba(0, 210, 255, 0.3);
            border-radius: 12px;
            font-size: 1rem;
            font-weight: bold;
            outline: none;
            cursor: pointer;
            transition: all 0.3s ease;
            -webkit-appearance: none;
            appearance: none;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100' fill='%2300d2ff'><polygon points='0,0 100,0 50,50'/></svg>");
            background-repeat: no-repeat;
            background-position: right 15px center;
            background-size: 12px;
        }

        .select-cyber:focus {
            border-color: #00ffaa;
            box-shadow: 0 0 10px rgba(0, 255, 170, 0.3);
            color: #00ffaa;
        }

        .select-cyber option {
            background: #14262c;
            color: #00d2ff;
        }

        .feed-noticias {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .noticia-tarjeta {
            background: rgba(255, 255, 255, 0.06);
            border-left: 4px solid #00d2ff;
            padding: 16px;
            border-radius: 0 12px 12px 0;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            transition: all 0.3s ease;
        }

        @keyframes cyber-pulse {
            0% { opacity: 0.6; border-left-color: #00d2ff; }
            50% { opacity: 1; border-left-color: #00ffaa; }
            100% { opacity: 0.6; border-left-color: #00d2ff; }
        }

        .escaneando {
            animation: cyber-pulse 1s infinite ease-in-out;
        }

        .noticia-tarjeta h3 {
            font-size: 1.05rem;
            margin-bottom: 8px;
            color: white;
            line-height: 1.4;
        }

        /* Estilo para los enlaces de noticias reales */
        .noticia-tarjeta a {
            color: #00d2ff;
            text-decoration: none;
            font-weight: bold;
            display: inline-block;
            margin-top: 10px;
            font-size: 0.9rem;
        }
        
        .noticia-tarjeta a:active {
            color: #00ffaa;
        }

        .noticia-info {
            font-size: 0.8rem;
            color: #00ffaa;
            display: flex;
            justify-content: space-between;
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <header>
        <h1>🌍 CyberNews Hub</h1>
        <p class="subtitulo">Conexión satelital con los principales focos de información global.</p>
    </header>

    <div class="selector-container">
        <label for="pais-selector">🛰️ Sintonizar Estación:</label>
        <select id="pais-selector" class="select-cyber">
            <option value="" disabled selected>-- Selecciona un país del mundo --</option>
            <option value="es">🇪🇸 España</option>
            <option value="us">🇺🇸 Estados Unidos</option>
            <option value="mx">🇲🇽 México</option>
            <option value="ar">🇦🇷 Argentina</option>
            <option value="co">🇨🇴 Colombia</option>
            <option value="cl">🇨🇱 Chile</option>
            <option value="gb">🇬🇧 Reino Unido</option>
            <option value="fr">🇫🇷 Francia</option>
            <option value="de">🇩🇪 Alemania</option>
            <option value="it">🇮🇹 Italia</option>
            <option value="jp">🇯🇵 Japón</option>
            <option value="cn">🇨🇳 China</option>
            <option value="in">🇮🇳 India</option>
            <option value="ru">🇷🇺 Rusia</option>
            <option value="br">🇧🇷 Brasil</option>
            <option value="ca">🇨🇦 Canadá</option>
            <option value="au">🇦🇺 Australia</option>
        </select>
    </div>

    <div class="feed-noticias" id="feed">
        <div class="noticia-tarjeta" id="pantalla-estado">
            <h3 id="texto-estado">Selecciona un objetivo en la barra superior para establecer conexión satelital...</h3>
            <div class="noticia-info">
                <span id="info-izq">Sistema: Listo</span>
                <span id="info-der">Canal: Standby</span>
            </div>
        </div>
    </div>

    <script>
        function playCyberClick() {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                const audioCtx = new AudioContext();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                
                osc.type = 'sine'; 
                osc.frequency.setValueAtTime(1400, audioCtx.currentTime); 
                osc.frequency.exponentialRampToValueAtTime(400, audioCtx.currentTime + 0.04);
                
                gain.gain.setValueAtTime(0.12, audioCtx.currentTime); 
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.04);
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.04);
            } catch (e) {
                console.log("Audio no disponible");
            }
        }

        const selector = document.getElementById('pais-selector');
        const feed = document.getElementById('feed');

        selector.addEventListener('change', async (evento) => {
            playCyberClick();

            const codigoPais = selector.value;
            const nombrePais = selector.options[selector.selectedIndex].text;
            
            // 1. Mostrar pantalla de carga simulada con el efecto que ya viste
            feed.innerHTML = `
                <div class="noticia-tarjeta escaneando" style="border-left-color: #00ffaa;">
                    <h3>🛰️ [CONECTANDO] Enlazando con la señal de ${nombrePais}... Descargando paquetes de datos del satélite.</h3>
                    <div class="noticia-info">
                        <span>Sistema: ESCANEANDO</span>
                        <span>Canal: Buscando...</span>
                    </div>
                </div>
            `;

            // 2. Conexión asíncrona real mediante API pública de feeds de noticias globales
            try {
                // Usamos un proxy de noticias abierto filtrado por el código del país elegido
                const respuesta = await fetch(`https://newsdata.io/api/1/news?apikey=pub_40854fa16b0df3f009f7b1dbbd8f8f3c71383&country=${codigoPais}&language=es,en`);
                const datos = await respuesta.json();
                
                // Limpiamos la pantalla de carga para meter las noticias reales de internet
                feed.innerHTML = "";

                if (datos.results && datos.results.length > 0) {
                    // Cogemos las 5 noticias más frescas que nos devuelva el servidor
                    const topNoticias = datos.results.slice(0, 5);

                    topNoticias.forEach(noticia => {
                        const tarjetaHTML = `
                            <div class="noticia-tarjeta" style="border-left-color: #00d2ff;">
                                <h3>${noticia.title}</h3>
                                <div class="noticia-info">
                                    <span>📰 Fuente: ${noticia.source_id || 'Global'}</span>
                                    <span>⏱️ Satélite activo</span>
                                </div>
                                <a href="${noticia.link}" target="_blank" class="fx-click">Leer titular completo →</a>
                            </div>
                        `;
                        feed.innerHTML += tarjetaHTML;
                    });

                    // Vincular sonido a los nuevos enlaces de lectura creados dinámicamente
                    document.querySelectorAll('.fx-click').forEach(enlace => {
                        enlace.addEventListener('click', playCyberClick);
                    });

                } else {
                    feed.innerHTML = `
                        <div class="noticia-tarjeta" style="border-left-color: #ff0055;">
                            <h3>⚠️ [ERROR DE ENLACE] No se han encontrado frecuencias de noticias disponibles en español/inglés para este cuadrante ahora mismo.</h3>
                            <div class="noticia-info">
                                <span>Sistema: Abortado</span>
                                <span>Código: 404_EMPTY</span>
                            </div>
                        </div>
                    `;
                }

            } catch (error) {
                // Control de fallos profesional si internet va lento o se corta la API
                feed.innerHTML = `
                    <div class="noticia-tarjeta" style="border-left-color: #ff0055;">
                        <h3>❌ [CONEXIÓN INTERRUMPIDA] El satélite no responde. Revisa tu conexión a la red o intenta sintonizar otro país.</h3>
                        <div class="noticia-info">
                            <span>Sistema: Desconectado</span>
                            <span>Fallo: API_TIMEOUT</span>
                        </div>
                    </div>
                `;
            }
        });
    </script>
</body>
</html>
