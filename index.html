<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global News Cyber-Hub</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }

        body {
            background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
            margin-top: 10px;
        }

        h1 {
            font-size: 2rem;
            color: #00d2ff;
            text-shadow: 0 0 15px rgba(0,210,255,0.4);
            margin-bottom: 8px;
        }

        .subtitulo {
            font-size: 0.95rem;
            opacity: 0.8;
        }

        .selector-container {
            width: 100%;
            max-width: 500px;
            margin-bottom: 30px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .selector-container label {
            font-size: 0.85rem;
            color: #00ffaa;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: bold;
        }

        .select-cyber {
            width: 100%;
            padding: 14px;
            background: rgba(0, 0, 0, 0.4);
            color: #00d2ff;
            border: 1px solid rgba(0, 210, 255, 0.3);
            border-radius: 12px;
            font-size: 1rem;
            font-weight: bold;
            outline: none;
            cursor: pointer;
            transition: all 0.3s ease;
            -webkit-appearance: none;
            appearance: none;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100' fill='%2300d2ff'><polygon points='0,0 100,0 50,50'/></svg>");
            background-repeat: no-repeat;
            background-position: right 15px center;
            background-size: 12px;
        }

        .select-cyber:focus {
            border-color: #00ffaa;
            box-shadow: 0 0 10px rgba(0, 255, 170, 0.3);
            color: #00ffaa;
        }

        .select-cyber option {
            background: #14262c;
            color: #00d2ff;
        }

        .feed-noticias {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .noticia-tarjeta {
            background: rgba(255, 255, 255, 0.06);
            border-left: 4px solid #00d2ff;
            padding: 16px;
            border-radius: 0 12px 12px 0;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            transition: all 0.3s ease;
        }

        @keyframes cyber-pulse {
            0% { opacity: 0.6; border-left-color: #00d2ff; }
            50% { opacity: 1; border-left-color: #00ffaa; }
            100% { opacity: 0.6; border-left-color: #00d2ff; }
        }

        .escaneando {
            animation: cyber-pulse 1s infinite ease-in-out;
        }

        .noticia-tarjeta h3 {
            font-size: 1.05rem;
            margin-bottom: 8px;
            color: white;
            line-height: 1.4;
        }

        .noticia-tarjeta a {
            color: #00d2ff;
            text-decoration: none;
            font-weight: bold;
            display: inline-block;
            margin-top: 10px;
            font-size: 0.9rem;
        }
        
        .noticia-tarjeta a:active {
            color: #00ffaa;
        }

        .noticia-info {
            font-size: 0.8rem;
            color: #00ffaa;
            display: flex;
            justify-content: space-between;
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <header>
        <h1>🌍 CyberNews Hub</h1>
        <p class="subtitulo">Conexión satelital con los principales focos de información global.</p>
    </header>

    <div class="selector-container">
        <label for="categoria-selector">🛰️ Sintonizar Canal de Transmisión:</label>
        <select id="categoria-selector" class="select-cyber">
            <option value="" disabled selected>-- Elige una frecuencia internacional --</option>
            <option value="technology">🤖 Tecnología & Ciberseguridad</option>
            <option value="science">🪐 Ciencia y Espacio</option>
            <option value="world">🌍 Noticias Globales</option>
            <option value="business">📈 Economía y Negocios</option>
            <option value="politics">🏛️ Política Internacional</option>
            <option value="entertainment">🎬 Cine y Cultura</option>
            <option value="sports">⚽ Deportes Globales</option>
        </select>
    </div>

    <div class="feed-noticias" id="feed">
        <div class="noticia-tarjeta" id="pantalla-estado">
            <h3>Selecciona una frecuencia en la barra superior para entablar la conexión de red...</h3>
            <div class="noticia-info">
                <span>Sistema: Listo</span>
                <span>Canal: Standby</span>
            </div>
        </div>
    </div>

    <script>
        function playCyberClick() {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                const audioCtx = new AudioContext();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                
                osc.type = 'sine'; 
                osc.frequency.setValueAtTime(1400, audioCtx.currentTime); 
                osc.frequency.exponentialRampToValueAtTime(400, audioCtx.currentTime + 0.04);
                
                gain.gain.setValueAtTime(0.12, audioCtx.currentTime); 
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.04);
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.04);
            } catch (e) {
                console.log("Audio no disponible");
            }
        }

        const selector = document.getElementById('categoria-selector');
        const feed = document.getElementById('feed');

        selector.addEventListener('change', async () => {
            playCyberClick();

            const categoria = selector.value;
            const nombreCategoria = selector.options[selector.selectedIndex].text;
            
            // 1. Efecto visual pro de escaneo en verde neón
            feed.innerHTML = `
                <div class="noticia-tarjeta escaneando" style="border-left-color: #00ffaa;">
                    <h3>⚡ [ENLAZANDO] Extrayendo transmisiones en vivo del canal ${nombreCategoria}... Por favor, espere.</h3>
                    <div class="noticia-info">
                        <span>Frecuencia: Conectando</span>
                        <span>Satélite: Buscando satélites de datos...</span>
                    </div>
                </div>
            `;

            // 2. Conexión Real vía Fetch a la API viva de internet
            try {
                const respuesta = await fetch(`https://inshorts.vercel.app/news?category=${categoria}`);
                const datos = await respuesta.json();
                
                feed.innerHTML = "";

                if (datos.data && datos.data.length > 0) {
                    // Seleccionamos los 5 artículos reales más calientes de la red
                    const topNoticias = datos.data.slice(0, 5);

                    topNoticias.forEach(noticia => {
                        feed.innerHTML += `
                            <div class="noticia-tarjeta" style="border-left-color: #00d2ff;">
                                <h3>${noticia.title}</h3>
                                <p style="font-size:0.9rem; margin: 8px 0; opacity:0.85; line-height:1.4;">${noticia.content}</p>
                                <div class="noticia-info">
                                    <span>✍️ Autor: ${noticia.author || 'Corresponsal'}</span>
                                    <span>⏱️ ${noticia.time || 'Reciente'} - ${noticia.date || ''}</span>
                                </div>
                                <a href="${noticia.readMoreUrl || '#'}" target="_blank" class="fx-click">Leer artículo completo original →</a>
                            </div>
                        `;
                    });

                } else {
                    throw new Error("Estructura de datos vacía");
                }

            } catch (error) {
                // Control si falla internet o la API satura
                feed.innerHTML = `
                    <div class="noticia-tarjeta" style="border-left-color: #ff0055;">
                        <h3>❌ [CONEXIÓN INTERRUMPIDA] El servidor internacional no responde en este milisegundo. Intenta sintonizar otra frecuencia.</h3>
                        <div class="noticia-info">
                            <span>Fallo: TIMEOUT_SATELITAL</span>
                            <span>Código: API_BUSY</span>
                        </div>
                    </div>
                `;
            }

            // Inyectar efectos mecánicos de audio a los botones inyectados
            document.querySelectorAll('.fx-click').forEach(enlace => {
                enlace.addEventListener('click', playCyberClick);
            });
        });
    </script>
</body>
</html>
